<!DOCTYPE html>
<html>
<head>
    <title>Birthday Wishes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 50%, #6bcf7f 100%);
            animation: gradient-shift 8s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% {
                background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 50%, #6bcf7f 100%);
            }
            50% {
                background: linear-gradient(135deg, #6bcf7f 0%, #ff6b6b 50%, #ffd93d 100%);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 80px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 42px;
            color: #0066cc;
            margin: 0;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .emoji {
            font-size: 50px;
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .music-btn {
            background-color: #667eea;
            color: white;
        }

        .music-btn:hover {
            background-color: #764ba2;
        }

        .logout-btn {
            background-color: #f44336;
            color: white;
        }

        .logout-btn:hover {
            background-color: #da190b;
        }

        #bg-music {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="emoji">🎉 🎂</div>
    <h1>🎉 Wish You Happy Birthday Balaji 🎂</h1>
    <div class="emoji">🎊 🎁 🎊</div>

    <!-- 🎵 Background Music -->
    <audio id="bg-music" loop>
        <source src="{{ url_for('static', filename='whishes.mp3') }}" type="audio/mpeg">
    </audio>

    <!-- ▶ CLICK TO PLAY MUSIC -->
    <button class="music-btn" onclick="playMusic()">
        ▶ Click to Start Music 🎵
    </button>

    <div class="controls">
        <p style="font-size: 14px; color: #333;">
            Open: 
            <a href="https://birthday-balaji.onrender.com" target="_blank">
                https://birthday-balaji.onrender.com
            </a>
        </p>

        <button class="music-btn" onclick="shareOnWhatsApp()">
            Share on WhatsApp
        </button>

        <button class="logout-btn" onclick="location.href='/logout'">
            Logout
        </button>
    </div>

</div>

<script>
    const music = document.getElementById("bg-music");

    // 🎵 Play music on button click
    function playMusic() {
        music.play().catch(err => {
            console.log("Audio play failed:", err);
        });
    }

    // 📤 WhatsApp share
    function shareOnWhatsApp() {
        const text = encodeURIComponent(
            "🎉 Happy Birthday! Check this surprise 🎂 https://birthday-balaji.onrender.com"
        );
        window.open("https://wa.me/?text=" + text, "_blank");
    }
</script>

</body>
</html>
