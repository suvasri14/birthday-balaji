<!DOCTYPE html>
<html>
<head>
    <title>Birthday Wishes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 50%, #6bcf7f 100%);
            animation: gradient-shift 8s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% {
                background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 50%, #6bcf7f 100%);
            }
            50% {
                background: linear-gradient(135deg, #6bcf7f 0%, #ff6b6b 50%, #ffd93d 100%);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 80px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 42px;
            color: #0066cc;
            margin: 0;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .emoji {
            font-size: 50px;
            margin: 20px 0;
        }

        .btn-group {
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .music-btn {
            background-color: #667eea;
            color: white;
        }

        .music-btn:hover {
            background-color: #764ba2;
        }

        .share-btn {
            background-color: #25D366;
            color: white;
        }

        .share-btn:hover {
            background-color: #1da851;
        }

        .logout-btn {
            background-color: #f44336;
            color: white;
        }

        .logout-btn:hover {
            background-color: #da190b;
        }

        #bg-music {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="emoji">🎉 🎂</div>
    <h1>🎉 Wish You Happy Birthday Balaji 🎂</h1>
    <div class="emoji">🎊 🎁 🎊</div>

    <!-- 🎵 AUDIO -->
    <audio id="bg-music" autoplay loop muted>
        <source src="/static/whishes.mp3" type="audio/mpeg">
    </audio>

    <!-- 🎛️ BUTTONS -->
    <div class="btn-group">

        <button class="music-btn" onclick="startMusic()">
            ▶ Start Music 🎵
        </button>

        <button class="share-btn" onclick="shareOnWhatsApp()">
            📤 Share
        </button>

        <button class="logout-btn" onclick="location.href='/logout'">
            Logout
        </button>

    </div>

</div>

<script>
    const music = document.getElementById("bg-music");

    // 🎵 Step 1: Try autoplay (silent allowed by browser)
    window.addEventListener("load", () => {
        music.play().catch(() => {
            console.log("Autoplay blocked");
        });
    });

    // 🔊 Step 2: Unlock sound on first user interaction
    function startMusic() {
        music.muted = false;
        music.play().catch(err => {
            console.log("Play failed:", err);
        });
    }

    // 🔥 Optional: unlock on any click (backup method)
    document.addEventListener("click", () => {
        music.muted = false;
        music.play();
    }, { once: true });

    // 📤 WhatsApp share
    function shareOnWhatsApp() {
        const text = encodeURIComponent(
            "🎉 Happy Birthday! Check this surprise 🎂 https://birthday-balaji.onrender.com"
        );
        window.open("https://wa.me/?text=" + text, "_blank");
    }
</script>

</body>
</html>
