<!DOCTYPE html>
<html>
<head>
    <title>Second Window</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 60px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .next-btn {
            background-color: #667eea;
            color: white;
        }
        .next-btn:hover {
            background-color: #764ba2;
        }
        .logout-btn {
            background-color: #f44336;
            color: white;
        }
        .logout-btn:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Second Window</h1>
        <p style="font-size: 18px; color: #555;">This is for Birthday Wishes</p>
        <div class="btn-group">
            <button class="next-btn" onclick="location.href='/birthday'">Continue to Birthday</button>
            <button class="logout-btn" onclick="location.href='/logout'">Logout</button>
        </div>
    </div>
</body>
</html>
